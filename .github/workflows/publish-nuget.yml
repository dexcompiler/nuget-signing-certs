name: Publish NuGet

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore NuGetSigningCertificates.sln --nologo

      - name: Build
        run: dotnet build NuGetSigningCertificates.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test tests/Dexcompiler.NuGetSigningCertificates.Tests/Dexcompiler.NuGetSigningCertificates.Tests.csproj --configuration Release --no-build --nologo

      - name: Pack
        run: dotnet pack src/Dexcompiler.NuGetSigningCertificates/Dexcompiler.NuGetSigningCertificates.csproj --configuration Release --no-build --nologo -o artifacts

      - name: Pack CLI tool
        run: dotnet pack src/Dexcompiler.NuGetSigningCertificates.Cli/Dexcompiler.NuGetSigningCertificates.Cli.csproj --configuration Release --no-build --nologo -o artifacts

      - name: Push nusign to NuGet
        run: |
          shopt -s nullglob
          packages=(artifacts/nusign.*.nupkg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No nusign package artifacts found."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            dotnet nuget push "$pkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nusign.*.nupkg
          if-no-files-found: error

  build-cli-assets:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish CLI NativeAOT
        run: dotnet publish src/Dexcompiler.NuGetSigningCertificates.Cli/Dexcompiler.NuGetSigningCertificates.Cli.csproj --configuration Release --nologo --self-contained true -r ${{ matrix.runtime }} -p:PublishAot=true -o artifacts/cli/${{ matrix.runtime }}

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.runtime }}
          path: artifacts/cli/${{ matrix.runtime }}/**
          if-no-files-found: error

  create-github-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - publish-library
      - build-cli-assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/release

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts/release -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi
          gh release create "${{ github.ref_name }}" "${files[@]}" --generate-notes --verify-tag

